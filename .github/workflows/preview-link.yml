name: Post preview link

# Cloudflare Pages reports each preview build to GitHub as a deployment.
# When one succeeds, put its URL in front of the client on the issue they
# opened — they should never have to open the pull request to see their change.

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  comment:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- bab:preview-link -->';

            const url = context.payload.deployment_status.environment_url;
            const environment = context.payload.deployment.environment || '';
            if (!url) return core.info('Deployment has no environment_url — skipping.');

            // The production GitHub Pages deploy also fires this event.
            if (/github-pages/i.test(environment)) {
              return core.info(`Production deployment (${environment}) — skipping.`);
            }

            const sha = context.payload.deployment.sha;
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const pr = prs.find(p => p.head.sha === sha);
            if (!pr) return core.info(`No open pull request at ${sha} — skipping.`);

            const match = /(?:closes|fixes|resolves)\s+#(\d+)/i.exec(pr.body || '');
            if (!match) return core.info(`PR #${pr.number} has no linked issue — skipping.`);
            const issue_number = Number(match[1]);

            const body = [
              MARKER,
              '### Your preview is ready',
              '',
              `**[Click here to see your change](${url})**`,
              '',
              'Have a look and check it says what you want.',
              '',
              "- Happy with it? Reply with the single word **publish** and it'll go live on the real website a minute or so later.",
              '- Not quite right? Just reply here telling me what to change, and I\'ll update this preview.',
              '',
              "*This is a separate practice copy of the site. The real website hasn't changed yet.*",
            ].join('\n');

            // Keep one preview comment per issue and update it in place, so a
            // few rounds of revisions don't bury the thread in duplicates.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              core.info(`Updated preview link on issue #${issue_number}.`);
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
              core.info(`Posted preview link on issue #${issue_number}.`);
            }
